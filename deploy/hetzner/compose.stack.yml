# Стек кабинета Seamster на общем сервере Hetzner.
#
# Сервис один: у кабинета нет ни Postgres, ни Redis — состояние лежит файлами
# в томе. Общий ночной дамп ищет базы и потому нас бы не увидел, но у него есть
# второй проход — по томам с файлами, отбираемым маской minio|upload|media|files.
# Отсюда имя тома: app-files даёт seamster_app-files и попадает в общий цикл
# без своего крона. Переименуешь том — продукт молча перестанет бэкапиться.
name: seamster

services:
  app:
    build:
      context: ../..
      dockerfile: Dockerfile
    # Секреты живут вне каталога стека: /opt/stacks синхронизируется rsync
    # с --delete и однажды снесёт всё, что лежит внутри.
    env_file:
      - /etc/seamster/secrets.env
    environment:
      PUBLIC_ORIGIN: ${PUBLIC_URL}
      HOST: '0.0.0.0'
      PORT: '8131'
      DATA_DIR: /data
      WEB_DIST: apps/web/dist
    volumes:
      - app-files:/data
    # Портов на хост нет намеренно: наружу смотрит только Caddy.
    restart: unless-stopped
    networks: [edge]

volumes:
  app-files:

networks:
  # Через неё Caddy достаёт контейнер по имени seamster-app-1.
  edge:
    external: true
