name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      # Бинарники репозитория лежат в Git LFS (.gitattributes). Без lfs: true
      # checkout кладёт текстовые указатели вместо картинок, и тесты, которые
      # читают настоящее фото, падают на декодировании.
      - uses: actions/checkout@v4
        with:
          lfs: true

      # Версия pnpm — только из packageManager в package.json. Указать её ещё
      # и здесь значит уронить прогон: action-setup v4 отказывается выбирать
      # между двумя источниками (ERR_PNPM_BAD_PM_VERSION).
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Часть тестов печатает лист и снимает его в браузере (packages/pattern,
      # golden/pattern и соседние). На раннере кэш ms-playwright пустой, и
      # launch падает «Executable doesn't exist». Ставим только chromium.
      - name: Chromium для тестов
        run: pnpm exec playwright install --with-deps chromium

      - name: Формат, линт, типы, тесты
        run: pnpm verify

      - name: Справочники и бэклог верификации
        run: pnpm kb:validate

  # Голден-сет гоняется отдельно: он медленный и ходит в Claude API.
  # Деградация точности блокирует мерж (CTO-SPEC.md §4.7).
  golden:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      # Бинарники репозитория лежат в Git LFS (.gitattributes). Без lfs: true
      # checkout кладёт текстовые указатели вместо картинок, и тесты, которые
      # читают настоящее фото, падают на декодировании.
      - uses: actions/checkout@v4
        with:
          lfs: true

      # Версия pnpm — только из packageManager в package.json. Указать её ещё
      # и здесь значит уронить прогон: action-setup v4 отказывается выбирать
      # между двумя источниками (ERR_PNPM_BAD_PM_VERSION).
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Часть тестов печатает лист и снимает его в браузере (packages/pattern,
      # golden/pattern и соседние). На раннере кэш ms-playwright пустой, и
      # launch падает «Executable doesn't exist». Ставим только chromium.
      - name: Chromium для тестов
        run: pnpm exec playwright install --with-deps chromium

      - name: Прогон голден-сета
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: pnpm golden
